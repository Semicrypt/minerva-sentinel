name: Build and Push Docker Images

on:
  push:
    branches:
      - master
      - docker-deployment
    paths:
      - "backend/**"
      - "frontend-v2/**"
      - ".github/workflows/build-and-push.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-north-1
  BACKEND_REPOSITORY: minerva-sentinel-backend
  FRONTEND_REPOSITORY: minerva-sentinel-frontend

jobs:
  build-and-push:
    name: Build and push images to ECR
    runs-on: ubuntu-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v7
        
      - name: Display GitHub identity
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Ref: ${{ github.ref }}"
          echo "Event: ${{ github.event_name }}"
          echo "Environment: ${{ github.environment }}"

      - name: Authenticate to AWS with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::878451097402:role/MinervaSentinelGitHubActionsRole
          aws-region: eu-north-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          platforms: linux/amd64
          provenance: false
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/minerva-sentinel-backend:latest
            ${{ steps.login-ecr.outputs.registry }}/minerva-sentinel-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend-v2
          push: true
          platforms: linux/amd64
          provenance: false
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/minerva-sentinel-frontend:latest
            ${{ steps.login-ecr.outputs.registry }}/minerva-sentinel-frontend:${{ github.sha }}