name: Build and Deploy Minerva Sentinel

on:
  push:
    branches:
      - master
    paths:
      - "backend/**"
      - "frontend-v2/**"
      - ".github/workflows/build-and-push.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-north-1
  BACKEND_REPOSITORY: minerva-sentinel-backend
  FRONTEND_REPOSITORY: minerva-sentinel-frontend

jobs:
  build-and-push:
    name: Build and push images to ECR
    runs-on: ubuntu-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v7

      - name: Authenticate to AWS with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          platforms: linux/amd64
          provenance: false
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.BACKEND_REPOSITORY }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.BACKEND_REPOSITORY }}:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend-v2
          push: true
          platforms: linux/amd64
          provenance: false
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.FRONTEND_REPOSITORY }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.FRONTEND_REPOSITORY }}:${{ github.sha }}

  deploy-to-ec2:
    name: Deploy containers to EC2 through SSM
    needs: build-and-push
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    env:
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}

    steps:
      - name: Authenticate to AWS with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Minerva Sentinel containers
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$EC2_INSTANCE_ID" ]; then
            echo "EC2_INSTANCE_ID GitHub variable is missing."
            exit 1
          fi

          command_id="$(
            aws ssm send-command \
              --region "$AWS_REGION" \
              --instance-ids "$EC2_INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --comment "Deploy Minerva Sentinel ${GITHUB_SHA}" \
              --parameters 'commands=[
                "set -e",
                "cd /home/ubuntu/minerva-sentinel",
                "aws ecr get-login-password --region eu-north-1 | docker login --username AWS --password-stdin 878451097402.dkr.ecr.eu-north-1.amazonaws.com",
                "docker compose --env-file .env -f docker-compose.production.yml pull backend frontend",
                "docker compose --env-file .env -f docker-compose.production.yml up -d --remove-orphans backend frontend",
                "docker compose --env-file .env -f docker-compose.production.yml ps"
              ]' \
              --query "Command.CommandId" \
              --output text
          )"

          echo "SSM command created: $command_id"

          for attempt in $(seq 1 60); do
            result="$(
              aws ssm get-command-invocation \
                --region "$AWS_REGION" \
                --command-id "$command_id" \
                --instance-id "$EC2_INSTANCE_ID" \
                --output json 2>/dev/null || true
            )"

            status="$(printf '%s' "$result" | jq -r '.Status // empty')"

            echo "Deployment status: ${status:-waiting} (${attempt}/60)"

            case "$status" in
              Success)
                echo "Deployment succeeded."
                printf '%s' "$result" | jq -r '.StandardOutputContent // empty'
                printf '%s' "$result" | jq -r '.StandardErrorContent // empty'
                exit 0
                ;;

              Failed|Cancelled|TimedOut|Cancelling|Undeliverable|Terminated)
                echo "Deployment failed."
                printf '%s' "$result" | jq -r '.StandardOutputContent // empty'
                printf '%s' "$result" | jq -r '.StandardErrorContent // empty'
                exit 1
                ;;

              *)
                sleep 5
                ;;
            esac
          done

          echo "Deployment timed out."
          exit 1