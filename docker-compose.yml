services:
  postgres:
    image: postgres:17-alpine
    container_name: hybrid-monitor-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: minerva-backend:local
    container_name: minerva-backend
    restart: unless-stopped

    env_file:
      - ./backend/.env

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      NODE_ENV: production
      PORT: 5000

    ports:
      - "5000:5000"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend-v2
      dockerfile: Dockerfile
    image: minerva-frontend:local
    container_name: minerva-frontend
    restart: unless-stopped

    ports:
      - "3000:80"

    depends_on:
      - backend

volumes:
  postgres_data: