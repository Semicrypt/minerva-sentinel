<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link
        rel="stylesheet"
        href="../css/main.css">

    <link
        rel="stylesheet"
        href="../css/auth.css">

</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <h1>Hybrid Cloud Monitor</h1>

        <p>
            Monitor Websites, APIs and Cloud Infrastructure
        </p>

        <form id="loginForm">

            <label>Email</label>

            <input
                type="email"
                id="email"
                placeholder="Enter email"
                required>

            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                required>

            <button type="submit">

                Sign In

            </button>

        </form>

        <p class="bottom-text">

            Don't have an account?

            <a href="register.html">

                Register

            </a>

        </p>

    </div>

</div>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>

</body>

</html>
